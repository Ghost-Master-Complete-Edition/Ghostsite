<div class="container">
    @for (post of contentItems; track post)
    {
    <div class="body">
        <h1>{{post.Title}}</h1>
        <img [src]="post.Media.url" class="image">
        <p>{{post.Body}}</p>
    </div>
    }
    @empty
    {
    <div class="body">
        <h1>An error occured while loading the posts. Please refresh the page.</h1>
    </div>
    }
</div>
